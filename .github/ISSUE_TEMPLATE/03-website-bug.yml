name: 웹사이트 문제 신고
description: 읽기 진도, 장 추천, 검색, 화면 표시 등 사이트 기능의 문제를 알려 주세요.
title: "[사이트 문제] "
body:
  - type: markdown
    attributes:
      value: The Software Factory를 읽고 의견을 보내주셔서 감사합니다. 기존 이슈에 같은 내용이 있는지 먼저 살펴봐 주세요. 작성한 내용은 공개됩니다.
  - type: input
    id: location
    attributes:
      label: 관련 위치
      description: 페이지 URL과 장·절 이름을 적어 주세요. 책 전체에 대한 의견이면 “전체”라고 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 발생한 문제
      description: 무엇을 하던 중 어떤 문제가 발생했는지 적어 주세요. 가능하면 화면도 첨부해 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 선택 사항입니다. 문제가 발생하기 전 클릭하거나 입력한 순서를 알려 주세요.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 선택 사항입니다. 원래 어떻게 동작할 것으로 기대했나요?
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: 사용 환경
      description: 선택 사항입니다. 기기, 운영체제, 브라우저를 아는 범위에서 적어 주세요. 책의 버전이나 커밋 ID는 필요하지 않습니다.
    validations:
      required: false
