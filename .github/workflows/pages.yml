name: Publish book to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'manuscript/**'
      - 'research/sources.json'
      - 'book_project.json'
      - 'book-publication.json'
      - 'pattern_catalog.json'
      - 'CHANGELOG.md'
      - 'LICENSES/**'
      - 'scripts/check_project.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://factory.roboco.io
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - name: Check manuscript references
        run: python3 scripts/check_project.py
        working-directory: .
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile reader
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  # 책 토론 포럼(roboco-io/the-software-factory-demo)의 책 목차를 배포한 커밋으로 바로 동기화한다.
  # 포럼은 매시 동기화도 하므로 이 job이 실패해도 늦어도 1시간 안에 반영된다. 토큰이 없으면(포크 등) 건너뛴다.
  notify-forum:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Sync forum book table of contents
        env:
          FORUM_SYNC_TOKEN: ${{ secrets.FORUM_SYNC_TOKEN }}
          REF: ${{ github.sha }}
        run: |
          if [ -z "$FORUM_SYNC_TOKEN" ]; then
            echo "::notice::FORUM_SYNC_TOKEN이 없어 포럼 동기화를 건너뛴다."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -X POST \
            -H "Authorization: Bearer $FORUM_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"ref\":\"$REF\"}" \
            https://sfd-api.roboco.workers.dev/api/book/sync
