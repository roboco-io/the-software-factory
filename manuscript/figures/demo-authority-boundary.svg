<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1250" viewBox="0 0 640 1250" role="img" aria-labelledby="title desc">
<title id="title">변경을 만드는 곳과 게시하는 곳</title><desc id="desc">제어 평면이 실행 요청과 기준 코드를 연결한다. 구현 컨테이너에는 실제 GitHub 토큰/LLM 키를 넣지 않고 모델 호출은 출구에서 허용 여부를 확인하고 키를 주입한다. 제어 평면이 변경을 검사해 PR을 게시하고 새 리뷰와 병합 판정으로 이어간다. 모델 호출은 출구를 거쳐 샌드박스로 돌아가고 변경 보고는 제어 평면 게시로 연결한다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="14" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#287d70"/></marker></defs>
<rect width="640" height="1250" rx="18" fill="#f8fafb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="320" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#18313b">변경을 만드는 곳과 게시하는 곳</text>
<rect x="70" y="80" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="118" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">제어 평면이 작업을 연결</text>
<text x="320" y="155" text-anchor="middle" font-size="22" fill="#18313b">저장소 · 이슈 · 기준 코드</text>
<path d="M320 190 V229" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="235" width="500" height="145" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="273" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">구현 샌드박스</text>
<text x="320" y="310" text-anchor="middle" font-size="22" fill="#18313b">변경을 만들고 결과를 전달</text>
<text x="320" y="342" text-anchor="middle" font-size="22" fill="#18313b">실제 게시 토큰 · LLM 키 미전달</text>
<path d="M320 380 V419" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="425" width="500" height="145" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="463" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">실행 중 모델 호출의 출구</text>
<text x="320" y="500" text-anchor="middle" font-size="22" fill="#18313b">허용된 요청만 공급사에 전달</text>
<text x="320" y="532" text-anchor="middle" font-size="22" fill="#18313b">실제 API 키는 이 경계에서 주입</text>

<rect x="70" y="615" width="500" height="145" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="653" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">제어 평면의 변경 검사 · 게시</text>
<text x="320" y="690" text-anchor="middle" font-size="22" fill="#18313b">경로 · 기준 트리 · 파일 종류 확인</text>
<text x="320" y="722" text-anchor="middle" font-size="22" fill="#18313b">에이전트의 직접 push와 권한 분리</text>
<path d="M320 760 V799" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="805" width="500" height="150" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="843" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">새 리뷰와 병합 판정</text>
<text x="320" y="880" text-anchor="middle" font-size="22" fill="#18313b">지정 커밋을 읽고 결과를 확인</text>
<text x="320" y="912" text-anchor="middle" font-size="22" fill="#18313b">정책과 필수 증거로 반영 여부 판단</text>
<rect x="70" y="1100" width="500" height="120" rx="14" fill="#173f3c"/>
<text x="320" y="1140" text-anchor="middle" font-size="22" fill="#ffffff">실행 요청은 권한을 스스로 만들지 않는다.</text>
<text x="320" y="1174" text-anchor="middle" font-size="22" fill="#ffffff">출구 응답은 샌드박스로 돌아간다.</text>
<text x="320" y="1208" text-anchor="middle" font-size="22" fill="#ffffff">운영의 보안 한계는 따로 검증한다.</text>
<path d="M70 497 H20 V310 H64" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M570 310 H610 V687 H576" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<text x="362" y="409" text-anchor="middle" font-size="17" fill="#18313b">모델 호출</text>
</g></svg>
