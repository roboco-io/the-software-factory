<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1250" viewBox="0 0 640 1250" role="img" aria-labelledby="title desc">
<title id="title">리뉴얼 플랫폼의 실행 흐름</title><desc id="desc">운영자가 허용한 이슈를 제어 평면·구현 샌드박스·변경 검증/PR·리뷰·정책 판정·D1 기록과 포털로 연결한다. 병합 뒤의 배포·사업 성과와 자동 자기개선은 별도 확인 대상이다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="14" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#287d70"/></marker></defs>
<rect width="640" height="1250" rx="18" fill="#f8fafb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="320" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#18313b">리뉴얼 플랫폼의 실행 흐름</text>
<rect x="70" y="80" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="118" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">운영자가 허용한 이슈</text>
<text x="320" y="155" text-anchor="middle" font-size="22" fill="#18313b">등록된 저장소 · 요구사항 입력</text>
<path d="M320 190 V229" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="235" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="273" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">제어 평면의 실행 관리</text>
<text x="320" y="310" text-anchor="middle" font-size="22" fill="#18313b">중복 · 예산 · 상태 전환</text>
<path d="M320 345 V384" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="390" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="428" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">구현 샌드박스</text>
<text x="320" y="465" text-anchor="middle" font-size="22" fill="#18313b">요구사항을 변경으로 만든다</text>
<path d="M320 500 V539" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="545" width="500" height="150" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="583" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">변경 검증 · PR · 리뷰</text>
<text x="320" y="620" text-anchor="middle" font-size="22" fill="#18313b">제어 평면이 PR을 게시한다</text>
<text x="320" y="652" text-anchor="middle" font-size="22" fill="#18313b">새 샌드박스가 읽고 판정한다</text>
<path d="M320 695 V734" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="740" width="500" height="150" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="778" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">프로그램의 병합 판단</text>
<text x="320" y="815" text-anchor="middle" font-size="22" fill="#18313b">정책 · 현재 커밋 · 필수 체크</text>
<text x="320" y="847" text-anchor="middle" font-size="22" fill="#18313b">병합 · 대기 · 사람 확인</text>
<path d="M320 890 V929" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="935" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="973" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">D1 기록과 실행 포털</text>
<text x="320" y="1010" text-anchor="middle" font-size="22" fill="#18313b">상태 · 사유 코드 · 추정 비용</text>
<rect x="70" y="1100" width="500" height="120" rx="14" fill="#173f3c"/>
<text x="320" y="1140" text-anchor="middle" font-size="22" fill="#ffffff">플랫폼과 관리 대상 Conveyor를 구분한다.</text>
<text x="320" y="1174" text-anchor="middle" font-size="22" fill="#ffffff">병합과 배포 · 사업 성과는 별도다.</text>
<text x="320" y="1208" text-anchor="middle" font-size="22" fill="#ffffff">자동 자기개선 전체를 뜻하지 않는다.</text>
</g></svg>
