<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1250" viewBox="0 0 640 1250" role="img" aria-labelledby="title desc">
<title id="title">비즈니스 목표 중심 자동화의 전체 지도</title>
<desc id="desc">고객 문제와 사업 성과를 의도로 구체화한다. 에이전트는 모델과 도구를 사용하며 정책·계획 수립·집행·실행 이력·모니터링과 개선의 하네스 안에서 수행한다. 실행계획은 이번 작업의 순서와 방법이며 하네스는 이를 실행·통제하는 전체 체계다. 실제 결과는 의도와 수행 방식의 개선으로 돌아온다. 보안은 설계부터 종료까지 이어지는 조건이다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="14" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#287d70"/></marker></defs>
<rect width="640" height="1250" rx="18" fill="#f8fafb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">비즈니스 목표 중심 자동화의 전체 지도</text>
<rect x="70" y="80" width="500" height="142" rx="14" fill="#173f3c" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="120" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">목적과 보호 조건</text>
<text x="320.0" y="160" text-anchor="middle" font-size="26" font-weight="400" fill="#dcf2ed">고객 문제 · 기대 사업 성과</text>
<text x="320.0" y="198" text-anchor="middle" font-size="26" font-weight="400" fill="#dcf2ed">보안 · 신뢰성 · 전체 비용</text>
<path d="M320 222 V265" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="270" width="500" height="142" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="310" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">01 의도 정의·개선 파이프라인</text>
<text x="320.0" y="350" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">무엇을 왜 달성할 것인가</text>
<text x="320.0" y="388" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">성공 기준과 맥락 해석의 방향</text>
<path d="M320 412 V455" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="25" y="445" width="590" height="405" rx="18" fill="none" stroke="#86ada5" stroke-dasharray="7 6" stroke-width="2"/>
<rect x="70" y="460" width="500" height="142" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="500" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">02 에이전트의 전자동 개발</text>
<text x="320.0" y="540" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">모델과 도구를 사용해 수행</text>
<text x="320.0" y="578" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">정책이 허용한 범위는 개별 승인 없이</text>
<path d="M320 602 V645" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="650" width="500" height="142" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="690" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">03 정책 기반 하네스 개선</text>
<text x="320.0" y="730" text-anchor="middle" font-size="24" font-weight="400" fill="#18313b">정책 → 계획 수립·집행 → 이력</text>
<text x="320.0" y="768" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">모니터링과 개선 → 다음 실행</text>
<text x="320" y="832" text-anchor="middle" font-size="24" font-weight="400" fill="#18313b">에이전트의 수행은 하네스 안에서 이루어진다.</text>
<path d="M320 850 V890" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="895" width="500" height="142" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="935" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">증거와 실제 운영 결과</text>
<text x="320.0" y="975" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">구현 수용과 사용자 결과를 구분</text>
<text x="320.0" y="1013" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">관찰 → 의도와 수행 방식 재검토</text>
<path d="M570 966 H630 V340 H576" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630 720 H576" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="1090" text-anchor="middle" font-size="26" font-weight="700" fill="#18313b">환류: 목표도, 수행 방식도 근거로 개선</text>
<rect x="70" y="1120" width="500" height="110" rx="14" fill="#173f3c" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="1160" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">SDLC 전반의 보안</text>
<text x="320.0" y="1200" text-anchor="middle" font-size="26" font-weight="400" fill="#dcf2ed">요구·설계부터 개발·운영·종료까지</text>
</g>
</svg>
