<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title desc"><title id="title">정책 기반 하네스 개선 사이클</title><desc id="desc">타협할 수 없는 최상위 원칙 아래 정책, 계획과 집행, 실행 이력, 모니터링과 개선이 순환한다. 네 단계는 에이전트의 모든 작업을 감싼다. 개선은 하위 지침과 집행을 대상으로 하며 상위 원칙을 자동으로 완화하지 않는다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#287d70"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif"><rect width="960" height="1080" rx="20" fill="#f8fafb"/><text x="480" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#18313b">정책 기반 하네스 개선 사이클</text><rect x="40" y="80" width="880" height="95" rx="16" fill="#173f3c" stroke="#173f3c" stroke-width="2"/><text x="480" y="119" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">최상위 원칙</text><text x="480" y="154" text-anchor="middle" font-size="23" font-weight="400" fill="#dcf2ed">작업과 자동 개선이 타협하거나 우회할 수 없는 경계</text><rect x="20" y="195" width="920" height="735" rx="28" fill="none" stroke="#86ada5" stroke-width="2" stroke-dasharray="8 7"/><text x="72" y="230" text-anchor="start" font-size="22" font-weight="700" fill="#18313b">하네스 = 네 단계 전체</text><path d="M665 315 C780 315 800 360 800 422" fill="none" stroke="#287d70" stroke-width="4" marker-end="url(#arrow)"/><path d="M800 602 C800 715 735 780 665 780" fill="none" stroke="#287d70" stroke-width="4" marker-end="url(#arrow)"/><path d="M295 780 C175 780 160 690 160 602" fill="none" stroke="#287d70" stroke-width="4" marker-end="url(#arrow)"/><path d="M160 422 C160 335 235 315 295 315" fill="none" stroke="#287d70" stroke-width="4" marker-end="url(#arrow)"/><rect x="295" y="250" width="370" height="140" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="480.0" y="295" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">01  정책</text><text x="480.0" y="335" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">에이전트에게 일을 맡기는 지침</text><text x="480.0" y="366" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">범위·우선순위·권한·보고</text><rect x="640" y="422" width="280" height="180" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="780.0" y="467" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">02  계획과 집행</text><text x="780.0" y="507" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">정책에 따른 작업과 도구</text><text x="780.0" y="538" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">가드레일·검증·보고</text><rect x="295" y="710" width="370" height="140" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="480.0" y="755" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">03  실행 이력</text><text x="480.0" y="795" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">적용 정책·행동·변경·증거</text><text x="480.0" y="826" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">중단·이관·판단 근거</text><rect x="40" y="422" width="280" height="180" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="180.0" y="467" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">04  모니터링·개선</text><text x="180.0" y="507" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">이력·운영·사용자 신호</text><text x="180.0" y="538" text-anchor="middle" font-size="21" font-weight="400" fill="#18313b">원인에 맞춘 수정과 평가</text><rect x="345" y="445" width="270" height="135" rx="16" fill="#d7e9e4" stroke="#287d70" stroke-width="2"/><text x="480" y="491" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">에이전트의 작업</text><text x="480" y="536" text-anchor="middle" font-size="19" font-weight="400" fill="#18313b">모든 수행을 사이클로 감싼다</text><path d="M480 390 V445" fill="none" stroke="#6a8a85" stroke-width="2" stroke-dasharray="6 6"/><path d="M640 512 H615" fill="none" stroke="#6a8a85" stroke-width="2" stroke-dasharray="6 6"/><path d="M480 580 V710" fill="none" stroke="#6a8a85" stroke-width="2" stroke-dasharray="6 6"/><rect x="40" y="954" width="880" height="95" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="480" y="993" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">원칙은 보존 · 하위 지침은 구체화 · 집행은 개선</text><text x="480" y="1028" text-anchor="middle" font-size="22" font-weight="400" fill="#18313b">원칙과 충돌하면 실행을 멈추고 판단을 요청한다.</text></g></svg>