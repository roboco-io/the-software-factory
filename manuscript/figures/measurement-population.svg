<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img" aria-labelledby="title desc">
<title id="title">자동 완주율의 분모를 고르는 방법</title>
<desc id="desc">같은 관찰 기간과 기준에서 전체 요청 안에 자동 처리 가능 요청, 실행 시작 요청, 자동 완주 요청을 구분한다. 사람 판단·보류·차단도 전체 요청에서 숨기지 않는다. 기간 경계와 미보고 비용을 별도로 기록한다. 면적은 비율을 나타내지 않는다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#287d70"/></marker></defs>
<rect width="640" height="1110" rx="18" fill="#f8fafb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">자동 완주율의 분모를 고르는 방법</text>
<rect x="25" y="85" width="590" height="700" rx="16" fill="none" stroke="#173f3c" stroke-width="3"/>
<text x="320" y="130" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">전체 요청 A</text>
<rect x="50" y="165" width="540" height="420" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="212" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">자동 처리 가능 B</text>
<rect x="75" y="250" width="490" height="285" rx="14" fill="#d7e9e4" stroke="#86ada5" stroke-width="2"/>
<text x="320" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#18313b">실행 시작 C</text>
<rect x="100" y="345" width="440" height="135" rx="14" fill="#173f3c" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="385" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">자동 완주 D</text>
<text x="320.0" y="425" text-anchor="middle" font-size="26" font-weight="400" fill="#dcf2ed">정의한 성공·완료 조건 충족</text>
<text x="320" y="635" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">사람 판단 · 보류 · 차단도 A에 남긴다.</text>
<text x="320" y="685" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">분류 기준과 상태 전이를 기록한다.</text>
<text x="320" y="747" text-anchor="middle" font-size="24" font-weight="400" fill="#18313b">면적과 상자 크기는 실제 비율이 아니다.</text>
<rect x="40" y="815" width="560" height="150" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="855" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">서로 다른 두 질문</text>
<text x="320.0" y="895" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">D ÷ B: 가능한 범위에서 얼마나 완주했나</text>
<text x="320.0" y="933" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">D ÷ A: 전체 요청 중 얼마나 자동 완주했나</text>
<text x="320" y="1010" text-anchor="middle" font-size="25" font-weight="700" fill="#18313b">기간 경계 · 진행 중 · 비용 누락을 따로 기록</text>
<text x="320" y="1055" text-anchor="middle" font-size="25" font-weight="400" fill="#18313b">자동 완주와 고객의 사업 성과는 별도 확인</text>
</g>
</svg>
