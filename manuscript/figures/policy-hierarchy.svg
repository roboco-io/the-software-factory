<svg xmlns="http://www.w3.org/2000/svg" width="760" height="875" viewBox="0 0 760 875" role="img" aria-labelledby="title desc"><title id="title">정책의 계층과 적용 범위</title><desc id="desc">최상위 원칙을 조직 공통 정책, 제품·저장소 정책, 작업별 지침으로 구체화한다. 하위 지침은 상위 원칙을 완화하지 못하며 적용 범위와 강제성은 별개다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#287d70"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif"><rect width="760" height="875" rx="20" fill="#f8fafb"/><text x="380" y="51" text-anchor="middle" font-size="32" font-weight="700" fill="#18313b">정책의 계층과 적용 범위</text><text x="380" y="84" text-anchor="middle" font-size="22" font-weight="400" fill="#18313b">상위 원칙을 보존하며 지침을 구체화한다</text><rect x="40" y="110" width="680" height="140" rx="16" fill="#173f3c" stroke="#173f3c" stroke-width="2"/><text x="380" y="157" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">최상위 원칙</text><text x="380" y="198" text-anchor="middle" font-size="25" font-weight="400" fill="#ffffff">보안·준법의 경계</text><text x="380" y="232" text-anchor="middle" font-size="22" font-weight="400" fill="#dcf2ed">개별 실행과 자동 개선에서 타협·우회 불가</text><path d="M380 250 V293" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="305" width="620" height="110" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="380" y="348" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">조직 공통 정책</text><text x="380" y="388" text-anchor="middle" font-size="23" font-weight="400" fill="#18313b">접근·권한·협업·보고의 공통 지침</text><path d="M380 410 V453" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="465" width="620" height="110" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="380" y="508" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">제품·저장소 정책</text><text x="380" y="548" text-anchor="middle" font-size="23" font-weight="400" fill="#18313b">업무·환경·의존 관계에 맞춘 지침</text><path d="M380 570 V613" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="625" width="620" height="110" rx="16" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="380" y="668" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">작업별 지침</text><text x="380" y="708" text-anchor="middle" font-size="23" font-weight="400" fill="#18313b">이번 작업의 대상·산출물·보고·중단 조건</text><text x="380" y="792" text-anchor="middle" font-size="23" font-weight="700" fill="#18313b">하위 정책에도 강제 조건이 있을 수 있다.</text><text x="380" y="831" text-anchor="middle" font-size="22" font-weight="400" fill="#18313b">범위·소유자·변경 권한·충돌 처리 경로를 명시한다.</text></g></svg>