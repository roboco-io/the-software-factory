<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
<title id="title">응답이 없을 때 곧바로 재시도하지 않는다</title>
<desc id="desc">외부 발송이 허용된 작업에서 응답이 누락되면 결과 미확인으로 분류하고 권한 안에서 전달 상태를 조사한다. 전달 확인이면 재발송하지 않고, 미전달과 재시도 안전 조건이 확인되면 재시도하며, 미확인 상태는 보류한다.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="14" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#287d70"/></marker></defs>
<rect width="640" height="960" rx="18" fill="#f8fafb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">응답이 없을 때 곧바로 재시도하지 않는다</text>
<rect x="70" y="80" width="500" height="110" rx="14" fill="#173f3c" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="120" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">발송 후 응답 누락</text>
<text x="320.0" y="160" text-anchor="middle" font-size="26" font-weight="400" fill="#dcf2ed">실패가 아니라 결과 미확인 상태</text>
<path d="M320 190 V230" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="235" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="275" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">허용 범위에서 전달 상태 조사</text>
<text x="320.0" y="315" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">상대 시스템의 상태와 요청 이력 확인</text>
<path d="M320 345 V370 H20 V735" fill="none" stroke="#287d70" stroke-width="3"/>
<path d="M20 455 H64" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M20 595 H64" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M20 735 H64" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="70" y="400" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="440" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">전달 확인</text>
<text x="320.0" y="480" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">재발송하지 않고 결과를 연결</text>
<rect x="70" y="540" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="580" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">미전달과 안전 조건 확인</text>
<text x="320.0" y="620" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">중복 방지·한도 안에서 재시도</text>
<rect x="70" y="680" width="500" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="720" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">상태를 확인할 수 없음</text>
<text x="320.0" y="760" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">보류·기록 후 정책의 판단 경로로 이관</text>
<text x="320" y="855" text-anchor="middle" font-size="24" font-weight="400" fill="#18313b">확인되지 않은 상태를 실패로 단정하지 않는다.</text>
</g>
</svg>
