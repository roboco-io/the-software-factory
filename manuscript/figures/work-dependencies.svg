<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1050" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
<title id="title">작업을 나눌 때 함께 정할 의존 관계</title>
<desc id="desc">문의 답변의 근거 탐색과 수신 대상·권한 사전 확인은 조건이 갖춰지면 병렬 수행할 수 있다. 초안은 근거에 의존하며 발송 판단 전에는 결과 통합과 현재 권한·상태 재확인이 필요하다. 발송은 별도로 위임된 경우에만 수행한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#287d70"/></marker></defs>
<rect width="640" height="1050" rx="18" fill="#f8fafb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#18313b">작업을 나눌 때 함께 정할 의존 관계</text>
<rect x="40" y="80" width="560" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/>
<text x="320.0" y="120" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">공통 의도와 작업 계약</text>
<text x="320.0" y="160" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">초안 작성과 외부 발송의 위임을 구분</text>
<path d="M320 190 V230" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="235" width="560" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="320" y="275" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">A: 현재 자료의 근거 탐색</text><text x="320" y="315" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">답변에 적용할 자료와 범위 확인</text><path d="M320 345 V385" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="390" width="560" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="320" y="430" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">A의 결과 → 답변 초안</text><text x="320" y="470" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">주장과 근거·답변 범위를 연결</text><rect x="40" y="550" width="560" height="110" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="320" y="590" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">B: 수신 대상·권한의 사전 확인</text><text x="320" y="630" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">A와 조건이 갖춰지면 병렬로 준비</text><path d="M40 135 H20 V605 H38" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 445 H620 V730 H320" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 660 V750" fill="none" stroke="#287d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="755" width="560" height="150" rx="14" fill="#edf5f3" stroke="#86ada5" stroke-width="2"/><text x="320" y="795" text-anchor="middle" font-size="29" font-weight="700" fill="#18313b">결과 통합과 현재 조건 재확인</text><text x="320" y="835" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">초안·수신 대상·현재 권한·증거 대조</text><text x="320" y="873" text-anchor="middle" font-size="26" font-weight="400" fill="#18313b">발송이 위임된 경우에만 발송</text><text x="320" y="970" text-anchor="middle" font-size="24" font-weight="400" fill="#18313b">사전 확인만으로 이후 권한이 유지되지는 않는다.</text><text x="320" y="1015" text-anchor="middle" font-size="26" font-weight="700" fill="#18313b">모든 작업이 병렬이라는 뜻이 아니다.</text></g>
</svg>
